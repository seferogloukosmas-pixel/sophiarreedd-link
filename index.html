<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#f8f6ef" name="theme-color"/><meta content="Sophia — exclusive off-duty photos and a more personal side." name="description"/><title>Sophia · A Little Closer</title><style>
:root {--ink:#2c3930; --moss:#365647; --mossdark:#2b493b;--cream:#f8f6ef;--soft:#fffefa;--leaf:#dfe9de;--muted:#687669;--rose:#b47770;}
*{box-sizing:border-box} html,body{margin:0;padding:0} body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 90% 0,#e4eee1,transparent 40%),#f1eee6;min-height:100svh;color:var(--ink);display:flex;justify-content:center;padding:24px 18px 44px;-webkit-font-smoothing:antialiased;}
main{width:min(100%,420px);background:var(--soft);border-radius:24px;overflow:hidden;box-shadow:0 20px 70px rgba(28,47,33,.14);border:1px solid #dfe4da;}
.header{position:absolute;z-index:3;top:17px;left:20px;color:white;font-size:13px;font-weight:800;letter-spacing:.22em;text-shadow:0 1px 8px #3338;}
.hero{position:relative;overflow:hidden;background:#acafa2;isolation:isolate;} img{display:block;width:100%;height:100%;object-fit:cover;}
.hero:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(17,36,25,.22),transparent 45%,rgba(16,35,21,.14));}
.copy{padding:20px 23px 25px;text-align:center} h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;line-height:1.07;font-size:31px;letter-spacing:-.04em;margin:0 0 8px;color:#314b3b} h1 em{font-style:italic;color:var(--rose)}
.tagline{font-size:13px;line-height:1.55;color:#647168;max-width:310px;margin:0 auto 16px;}
.cta{min-height:56px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--moss);color:white;border-radius:14px;text-decoration:none;font-weight:750;font-size:14px;letter-spacing:.005em;box-shadow:0 10px 23px rgba(40,77,52,.2);transition:background .18s,transform .18s;}
.cta:hover{background:var(--mossdark);transform:translateY(-1px)}.cta:active{transform:scale(.99)}.cta:focus-visible{outline:3px solid #c17f6d;outline-offset:3px}
.fine{margin:9px 0 0;color:#9ba59d;font-size:10px;line-height:1.4}
@media(max-width:480px){body{padding:0;background:var(--soft)}main{width:100%;border:0;box-shadow:none;border-radius:0}.copy{padding:18px 23px 22px}}
@media(max-height:740px) and (max-width:480px){.copy{padding-top:13px;padding-bottom:16px}h1{font-size:28px}.tagline{margin-bottom:13px}.cta{min-height:52px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.hero{height:clamp(286px,43svh,365px)}.hero img{object-position:50% 26%;}

@media(max-height:740px) and (max-width:480px){.hero{height:clamp(244px,39svh,320px)}}

/* Gentle closing signature — decorative only; the main CTA remains dominant */
.signoff{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:11px;color:#859187;}
.signoff-divider{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;}
.signoff-divider .line{width:52px;height:1px;background:#d8dfd6;}
.signoff-divider svg{width:15px;height:15px;stroke:#b48d85;fill:none;stroke-width:1.5;}
.signature{font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.3;font-style:italic;color:#7d8d81;letter-spacing:.01em;}
.signoff-note{display:flex;align-items:center;justify-content:center;gap:7px;margin:0;font-size:11px;color:#a2ada3;letter-spacing:.005em;line-height:1.4;}
.signoff-note svg{height:12px;width:12px;stroke:currentColor;stroke-width:1.7;fill:none;}
@media(max-height:740px) and (max-width:480px){.signoff{margin-top:19px;gap:9px}.signature{font-size:13px}}
